<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доставка — склад отправления</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">3Д Печать</div>
      <nav class="admin-nav">
        <a href="admin.html">Дашборд</a>
        <a href="admin-orders.html">Заказы</a>
        <a href="admin-clients.html">Клиенты</a>
        <a href="admin-support.html">Поддержка</a>
        <a href="admin-warehouse.html">Склад</a>
        <a href="admin-settings.html">Настройки услуг</a>
        <a href="admin-delivery.html" class="active">Доставка Почты</a>
        <a href="admin-notifications.html">Уведомления</a>
        <a href="admin-reviews.html">Отзывы</a>
      </nav>
      <button class="admin-btn" data-admin-logout style="margin-top:12px;">Выйти</button>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <h2 style="margin:0;">Склад отправления (Почта России)</h2>
        <div data-admin-name></div>
      </div>
      <section class="admin-card">
        <p class="muted-small" style="margin-top:0;">ОПС, с которого уходят посылки. Индекс нужен для расчёта тарифа и создания отправления в «Отправке».</p>
        <div class="search-row" style="display:flex;gap:8px;margin:12px 0;">
          <input class="input" type="text" id="warehouse-city" value="Москва" placeholder="Город" />
          <button class="btn-secondary" type="button" id="warehouse-search-btn">Найти ОПС</button>
        </div>
        <div id="warehouse-map" class="delivery-map" style="height:360px;border-radius:12px;overflow:hidden;"></div>
        <label class="field" style="margin-top:12px;">
          <span class="label">Выбранный ОПС</span>
          <input class="input" id="warehouse-address" type="text" readonly />
        </label>
        <label class="field">
          <span class="label">Почтовый индекс</span>
          <input class="input" id="warehouse-index" type="text" readonly />
        </label>
        <div class="actions" style="margin-top:12px;">
          <button class="btn-secondary" type="button" id="warehouse-save-btn">Сохранить склад</button>
        </div>
        <div id="warehouse-status" class="muted-small" style="margin-top:8px;"></div>
      </section>
    </main>
  </div>
  <script src="scripts/admin-common.js"></script>
  <script id="yandex-maps-loader"></script>
  <script src="scripts/admin-delivery.js"></script>
</body>
</html>
